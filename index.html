<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic meta tags included to allow for SEO & AI Agents to index the page correctly-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Starts the browser with a dark background, so there's no white flash before Arc loads the styles -->
    <meta name="color-scheme" content="dark">
    <title>Arc.js - A framework for building single page web applications</title>
    <meta name="description" content="A framework for building single page web applications.">
    <!-- Stylesheets are loaded by Arc: see Arc.init() in script.js and each page's static styles -->
    <script type="module" src="script.js"></script>
</head>
<body>
    <div id="app"></div>
</body>
</html>
